{% extends "base.html" %}{% block content %}<h1 class="page-title">🔍 جستجوی پلاک‌ها <small>فیلتر سوابق ثبت‌شده</small></h1><div class="card"><form class="form-grid"><div><label>شماره پلاک</label><input name="plate" placeholder="۲۱ب۳۴۵ایران۲۰" value="{{request.args.get('plate','')}}"></div><div><label>دوربین</label><input name="camera" placeholder="نام دوربین"></div><div><label>وضعیت تخلف</label><select name="violation"><option value="">همه</option><option value="1">فقط تخلف‌ها</option><option value="0">بدون تخلف</option></select></div><button class="btn">جستجو</button></form></div><div class="card"><div class="section-head"><h3>نتایج</h3><span class="muted">{{rows|length}} مورد</span></div><div class="table-wrap"><table class="table"><tr><th>پلاک</th><th>نوع</th><th>دوربین</th><th>سرعت</th><th>زمان</th></tr>{% for r in rows %}<tr><td><strong>{{r.plate}}</strong></td><td><span class="badge badge-info">{{r.category}}</span></td><td>{{r.camera}}</td><td>{{r.speed}} km/h</td><td dir="ltr">{{r.timestamp}}</td></tr>{% else %}<tr><td colspan="5" class="empty">نتیجه‌ای پیدا نشد.</td></tr>{% endfor %}</table></div></div>{% endblock %}
