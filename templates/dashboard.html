{% extends "base.html" %}{% block content %}<h1 class="page-title">داشبورد</h1><div class="stats-grid">{% for k,v in stats.items() %}<div class="card stat-card"><small>{{k}}</small><strong>{{v}}</strong></div>{% endfor %}</div><div class="card"><div class="section-head"><h3>آخرین ثبت‌ها</h3></div><div class="table-wrap"><table class="table"><tr><th>پلاک</th><th>دوربین</th><th>سرعت</th><th>زمان</th><th></th></tr>{% for r in recent %}<tr><td><strong>{{r.plate}}</strong></td><td>{{r.camera}}</td><td>{{r.speed}}</td><td dir="ltr">{{r.timestamp}}</td><td><a class="eye-btn" href="/record/{{r.id}}" title="جزئیات">◉</a></td></tr>{% else %}<tr><td colspan="5" class="empty">ثبت ترددی وجود ندارد.</td></tr>{% endfor %}</table></div></div>{% endblock %}
