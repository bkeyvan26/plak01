{% extends "base.html" %}{% block content %}<h1 class="page-title">📹 نمای زنده <small>پخش پردازش‌شده دوربین‌ها</small></h1><div class="live-toolbar"><div><label>تعداد نمایش</label><select id="count" class="form-select"><option>1</option><option>2</option><option>4</option><option>6</option><option>9</option></select></div><button class="btn" onclick="loadCameras()">اعمال چیدمان</button></div><div id="grid" class="live-grid"></div><script>async function loadCameras(){const cams=await (await fetch('/api/cameras')).json(),n=+document.getElementById('count').value,g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<n;i++){const c=cams[i%Math.max(cams.length,1)],id=c?c.id:{{camera_id|default(0)}};let b=document.createElement('div');b.className='live-box';b.innerHTML='<b>'+(c?c.name:'بدون دوربین')+'</b><button class="btn" onclick="this.parentElement.requestFullscreen()">تمام‌صفحه</button><img src="/video_feed?camera_id='+id+'">';g.appendChild(b)}}loadCameras();</script>{% endblock %}
