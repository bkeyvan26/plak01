{% extends "base.html" %}{% block content %}<h1 class="page-title">👥 کاربران <small>مدیریت حساب‌ها و نقش‌ها</small></h1><div class="card"><div class="section-head"><h3>افزودن یا بازنشانی کاربر</h3></div><form method="post" class="form-grid"><div><label>نام کاربری</label><input name="username" required></div><div><label>رمز موقت</label><input name="password" type="password" required></div><div><label>گروه دسترسی</label><select name="group">{% for g in groups %}<option>{{g.name}}</option>{% endfor %}</select></div><button class="btn">＋ ذخیره کاربر</button></form></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>نام کاربری</th><th>گروه</th><th>وضعیت</th></tr>{% for u in users %}<tr><td><strong>{{u.username}}</strong></td><td><span class="badge badge-info">{{u.group_name}}</span></td><td>{% if u.active %}<span class="badge badge-ok">فعال</span>{% else %}<span class="badge badge-off">غیرفعال</span>{% endif %}</td></tr>{% else %}<tr><td colspan="3" class="empty">کاربری ثبت نشده است.</td></tr>{% endfor %}</table></div></div>{% endblock %}
